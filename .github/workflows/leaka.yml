name: Real Enterprise CI/CD Test
on: [workflow_dispatch] 

jobs:
  run-leaka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Private Internal Server
        run: |
          echo "<h1>Welcome to the Private Bank Dashboard!</h1>" > index.html
          python -m http.server 3000 &
          sleep 3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Leaka Agent
        run: pip install browser-use langchain-openai langchain-anthropic requests playwright

      - name: Install Browsers
        run: playwright install --with-deps chromium

      - name: Execute Leaka Autonomous Runner
        env:
          LLM_PROVIDER: "openrouter"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LEAKA_API_URL: "https://witty-cows-shine.loca.lt" 
        run: |
          xvfb-run python leaka_runner.py --job-id 37a474f7b4e7432e9dda93d109f76bb2 --token leaka_runner_4dd528ce04ac5f29a11e4682510d3645
